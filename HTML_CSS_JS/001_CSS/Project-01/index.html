<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Wars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">

    <section class="team">
      <div class="card">
        <img src="assets/super-1.png" alt="Spiderman">
        <p class="name">Spiderman</p>
        <p class="points">12</p>
      </div>
      <div class="card">
        <img src="assets/super-3.png" alt="Wonder Women">
        <p class="name">Wonder Women</p>
        <p class="points">30</p>
      </div>
    </section>

    <h1 class="score">5 - 0</h1>

    <section class="team">
      <div class="card">
        <img src="assets/super-2.png" alt="Captain America">
        <p class="name">Captain America</p>
        <p class="points">50</p>
      </div>
      <div class="card">
        <img src="assets/super-4.png" alt="Gem Woman">
        <p class="name">Gem Woman</p>
        <p class="points">12</p>
      </div>
    </section>

  </main>
</body>
</html>
