<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Over</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <p class="logo">SUPER<br>OVER</p>
  </header>

  <main class="teams">

    <section class="team team-ind">
      <h1>IND</h1>
      <div class="balls">
        <span>4</span><span>3</span><span>2</span><span>6</span><span>6</span><span>6</span>
      </div>
      <p class="score">27/0</p>
    </section>

    <section class="team team-pak">
      <h1>PAK</h1>
      <div class="balls">
        <span>2</span><span>4</span><span>0</span><span>3</span><span>1</span><span>4</span>
      </div>
      <p class="score">14/0</p>
    </section>

  </main>

  <footer class="buttons">
    <button class="button bat" aria-label="Hit">&#127951;</button>
    <button class="button reset" aria-label="Reset">&#8635;</button>
  </footer>
</body>
</html>
