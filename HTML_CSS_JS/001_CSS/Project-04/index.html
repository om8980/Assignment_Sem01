<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="board">
      <div class="home red">
        <div class="home-inner">
          <span class="coin red-border"></span><span class="coin red-border"></span>
          <span class="coin red-border"></span><span class="coin red-border"></span>
        </div>
      </div>
      <div class="path path-top">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell green"></div><div class="cell green">&#9733;</div>
        <div class="cell green">&#9733;</div><div class="cell green"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell green"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell green"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell green"></div><div class="cell"></div>
      </div>
      <div class="home green">
        <div class="home-inner">
          <span class="coin green-border"></span><span class="coin green-border"></span>
          <span class="coin green-border"></span><span class="coin green-border"></span>
        </div>
      </div>
      <div class="path path-left">
        <div class="cell"></div><div class="cell red">&#9733;</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell red"></div><div class="cell red"></div><div class="cell red"></div><div class="cell red"></div><div class="cell red"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell red">&#9733;</div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div class="center"><div class="triangles"></div></div>
      <div class="path path-right">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell yellow">&#9733;</div><div class="cell"></div><div class="cell"></div>
        <div class="cell yellow"></div><div class="cell yellow"></div><div class="cell yellow"></div><div class="cell yellow"></div><div class="cell yellow"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell yellow">&#9733;</div><div class="cell"></div>
      </div>
      <div class="home blue">
        <div class="home-inner">
          <span class="coin blue-border"></span><span class="coin blue-border"></span>
          <span class="coin blue-border"></span><span class="coin blue-border"></span>
        </div>
      </div>
      <div class="path path-bottom">
        <div class="cell"></div><div class="cell blue"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell blue"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell blue"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell blue"></div><div class="cell blue">&#9733;</div>
        <div class="cell blue">&#9733;</div><div class="cell blue"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div class="home yellow">
        <div class="home-inner">
          <span class="coin yellow-border"></span><span class="coin yellow-border"></span>
          <span class="coin yellow-border"></span><span class="coin yellow-border"></span>
        </div>
      </div>
    </main>
</body>
</html>
